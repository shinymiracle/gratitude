<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiny's Gratitude</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --glow: rgba(120, 80, 255, 0.18);
    --accent: #7c4dff;
    --accent2: #00e5ff;
    --text: #e8e8f0;
    --muted: rgba(232, 232, 240, 0.38);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  /* ── Ambient background ── */
  .bg-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
    z-index: 0;
    transition: opacity 1.2s ease;
  }
  .bg-orb-1 {
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(124,77,255,0.22) 0%, transparent 70%);
    top: -180px; left: -180px;
  }
  .bg-orb-2 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(0,229,255,0.13) 0%, transparent 70%);
    bottom: -140px; right: -140px;
  }

  /* ── Stage ── */
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }

  /* ── Image frame ── */
  .frame-wrap {
    position: relative;
    max-width: min(92vw, 820px);
    max-height: min(88vh, 680px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .frame-wrap::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 22px;
    background: linear-gradient(135deg, var(--accent), transparent 50%, var(--accent2));
    opacity: 0;
    transition: opacity 0.6s ease;
    z-index: -1;
  }
  .frame-wrap.loaded::before { opacity: 1; }

  .frame-inner {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 32px 80px rgba(0,0,0,0.7),
      0 0 60px rgba(124,77,255,0.15);
    background: var(--surface);
  }

  #main-img {
    display: block;
    max-width: min(90vw, 800px);
    max-height: min(84vh, 660px);
    width: auto;
    height: auto;
    border-radius: 20px;
    opacity: 0;
    transform: scale(0.96);
    transition: opacity 0.65s cubic-bezier(0.22,1,0.36,1),
                transform 0.65s cubic-bezier(0.22,1,0.36,1);
    position: relative;
    z-index: 1;
  }
  #main-img.visible {
    opacity: 1;
    transform: scale(1);
  }

  /* Shimmer loader */
  .shimmer {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    background: linear-gradient(
      100deg,
      var(--surface) 30%,
      rgba(255,255,255,0.045) 50%,
      var(--surface) 70%
    );
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite linear;
    z-index: 0;
    transition: opacity 0.4s;
  }
  .shimmer.hidden { opacity: 0; pointer-events: none; }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ── Refresh hint ── */
  #hint {
    position: fixed;
    bottom: 28px;
    left: 28px;
    z-index: 10;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 7px;
    opacity: 0;
    animation: fadeHint 1.2s 1.6s ease forwards;
  }
  @keyframes fadeHint {
    to { opacity: 1; }
  }
  #hint svg { flex-shrink: 0; }

  /* ── Next button (click anywhere) ── */
  #next-btn {
    position: fixed;
    inset: 0;
    z-index: 5;
    cursor: pointer;
    background: transparent;
    border: none;
    outline: none;
  }

  /* ── Transition veil ── */
  #veil {
    position: fixed;
    inset: 0;
    z-index: 9;
    background: var(--bg);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }
  #veil.active { opacity: 1; }
</style>
</head>
<body>

<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div id="veil"></div>

<button id="next-btn" onclick="nextImage()" aria-label="Next image"></button>

<div id="stage">
  <div class="frame-wrap" id="frame-wrap">
    <div class="frame-inner" id="frame-inner">
      <div class="shimmer" id="shimmer"></div>
      <img id="main-img" alt="Viewer Content" />
    </div>
  </div>
</div>

<div id="hint">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M1 4v6h6M23 20v-6h-6"/>
    <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
  </svg>
 
</div>

<script>
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR2B5d8TyLesE24ZVNHLal3CoI0o9WQglZYPNWAQwdYL05q0qDc-fChNFFCWe4ng2vfuXmGiT-TcNtX/pub?gid=0&single=true&output=csv';

let images = [];
let currentIndex = -1;
let isTransitioning = false;

function driveDirectURL(url) {
  const patterns = [
    /drive\.google\.com\/file\/d\/([^\/\?]+)/,
    /drive\.google\.com\/open\?id=([^&]+)/,
    /id=([^&]+)/
  ];
  for (const p of patterns) {
    const m = url.match(p);
    if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1200`;
  }
  return url;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

async function loadSheet() {
  const res = await fetch(SHEET_CSV_URL);
  if (!res.ok) return [];
  const text = await res.text();
  const rows = text.trim().split('\n').map(r => r.split(',').map(c => c.trim().replace(/^"|"$/g, '')));
  
  const start = rows[0][0].toLowerCase() === 'order' ? 1 : 0;
  const parsed = rows.slice(start)
    .filter(r => r.length >= 2 && r[1])
    .map(r => ({ order: parseInt(r[0]) || 0, link: driveDirectURL(r[1]) }));
  return shuffle(parsed);
}

function showImage(idx) {
  if (!images[idx]) return;
  const { link } = images[idx];
  const img = document.getElementById('main-img');
  const shimmer = document.getElementById('shimmer');
  const frame = document.getElementById('frame-wrap');

  img.classList.remove('visible');
  shimmer.classList.remove('hidden');
  frame.classList.remove('loaded');

  img.onload = () => {
    shimmer.classList.add('hidden');
    frame.classList.add('loaded');
    img.classList.add('visible');
  };
  
  img.onerror = () => {
    shimmer.classList.add('hidden');
  };
  
  img.src = link;
}

function nextImage() {
  if (isTransitioning || images.length === 0) return;
  isTransitioning = true;

  const veil = document.getElementById('veil');
  veil.classList.add('active');

  setTimeout(() => {
    currentIndex = (currentIndex + 1) % images.length;
    showImage(currentIndex);
    veil.classList.remove('active');
    isTransitioning = false;
  }, 340);
}

async function init() {
  if (!SHEET_CSV_URL || SHEET_CSV_URL === 'YOUR_GOOGLE_SHEET_CSV_URL_HERE') return;
  try {
    images = await loadSheet();
    if (images.length > 0) {
      currentIndex = Math.floor(Math.random() * images.length);
      showImage(currentIndex);
    }
  } catch (e) {
    // Silently fails
  }
}

document.addEventListener('keydown', e => {
  if (['Space','ArrowRight','ArrowDown','Enter'].includes(e.code)) {
    e.preventDefault();
    nextImage();
  }
});

init();
</script>
</body>
</html>
