<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --glow: rgba(120, 80, 255, 0.18);
    --accent: #7c4dff;
    --accent2: #00e5ff;
    --text: #e8e8f0;
    --muted: rgba(232, 232, 240, 0.38);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  /* ── Ambient background ── */
  .bg-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
    z-index: 0;
    transition: opacity 1.2s ease;
  }
  .bg-orb-1 {
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(124,77,255,0.22) 0%, transparent 70%);
    top: -180px; left: -180px;
  }
  .bg-orb-2 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(0,229,255,0.13) 0%, transparent 70%);
    bottom: -140px; right: -140px;
  }

  /* ── Stage ── */
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }

  /* ── Image frame ── */
  .frame-wrap {
    position: relative;
    max-width: min(92vw, 820px);
    max-height: min(88vh, 680px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Glowing border ring */
  .frame-wrap::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 22px;
    background: linear-gradient(135deg, var(--accent), transparent 50%, var(--accent2));
    opacity: 0;
    transition: opacity 0.6s ease;
    z-index: -1;
  }
  .frame-wrap.loaded::before { opacity: 1; }

  .frame-inner {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 32px 80px rgba(0,0,0,0.7),
      0 0 60px rgba(124,77,255,0.15);
    background: var(--surface);
  }

  #main-img {
    display: block;
    max-width: min(90vw, 800px);
    max-height: min(84vh, 660px);
    width: auto;
    height: auto;
    border-radius: 20px;
    opacity: 0;
    transform: scale(0.96);
    transition: opacity 0.65s cubic-bezier(0.22,1,0.36,1),
                transform 0.65s cubic-bezier(0.22,1,0.36,1);
    position: relative;
    z-index: 1;
  }
  #main-img.visible {
    opacity: 1;
    transform: scale(1);
  }

  /* Shimmer loader */
  .shimmer {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    background: linear-gradient(
      100deg,
      var(--surface) 30%,
      rgba(255,255,255,0.045) 50%,
      var(--surface) 70%
    );
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite linear;
    z-index: 0;
    transition: opacity 0.4s;
  }
  .shimmer.hidden { opacity: 0; pointer-events: none; }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ── Corner badge: image counter ── */
  #counter {
    position: fixed;
    bottom: 28px;
    right: 28px;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .dot-track {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s, transform 0.3s;
  }
  .dot.active {
    background: var(--accent2);
    transform: scale(1.5);
    box-shadow: 0 0 6px var(--accent2);
  }

  /* ── Refresh hint ── */
  #hint {
    position: fixed;
    bottom: 28px;
    left: 28px;
    z-index: 10;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 7px;
    opacity: 0;
    animation: fadeHint 1.2s 1.6s ease forwards;
  }
  @keyframes fadeHint {
    to { opacity: 1; }
  }
  #hint svg { flex-shrink: 0; }

  /* ── Next button (click anywhere) ── */
  #next-btn {
    position: fixed;
    inset: 0;
    z-index: 5;
    cursor: pointer;
    background: transparent;
    border: none;
    outline: none;
  }

  /* ── Transition veil ── */
  #veil {
    position: fixed;
    inset: 0;
    z-index: 9;
    background: var(--bg);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }
  #veil.active { opacity: 1; }

  /* ── Error state ── */
  #error-box {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    color: var(--text);
    text-align: center;
    padding: 24px;
  }
  #error-box.show { display: flex; }
  #error-box h2 { font-size: 1.1rem; font-weight: 600; opacity: 0.9; }
  #error-box p  { font-size: 0.82rem; color: var(--muted); max-width: 320px; line-height: 1.6; }
  #error-box code {
    font-size: 0.75rem;
    background: rgba(255,255,255,0.07);
    padding: 8px 14px;
    border-radius: 8px;
    word-break: break-all;
    max-width: 340px;
    display: block;
    color: var(--accent2);
  }

</style>
</head>
<body>

<!-- Ambient orbs -->
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>

<!-- Veil for page transitions -->
<div id="veil"></div>

<!-- Invisible click-anywhere button -->
<button id="next-btn" onclick="nextImage()" aria-label="Next image"></button>

<!-- Main stage -->
<div id="stage">
  <div class="frame-wrap" id="frame-wrap">
    <div class="frame-inner" id="frame-inner">
      <div class="shimmer" id="shimmer"></div>
      <img id="main-img" alt="Random image" />
    </div>
    <div id="error-box"></div>
  </div>
</div>

<!-- Hint -->
<div id="hint">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M1 4v6h6M23 20v-6h-6"/>
    <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
  </svg>
  Click anywhere for next
</div>

<!-- Dot counter -->
<div id="counter"><div class="dot-track" id="dot-track"></div></div>

<script>
// ── Config ── Paste your Google Sheet CSV URL here ──────
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR2B5d8TyLesE24ZVNHLal3CoI0o9WQglZYPNWAQwdYL05q0qDc-fChNFFCWe4ng2vfuXmGiT-TcNtX/pub?gid=0&single=true&output=csv';

// ── State ────────────────────────────────────────────────
let images = [];
let currentIndex = -1;
let isTransitioning = false;

// ── Helpers ──────────────────────────────────────────────
function driveDirectURL(url) {
  // Convert various Google Drive share URLs to direct image URLs
  const patterns = [
    /drive\.google\.com\/file\/d\/([^\/\?]+)/,
    /drive\.google\.com\/open\?id=([^&]+)/,
    /id=([^&]+)/
  ];
  for (const p of patterns) {
    const m = url.match(p);
    if (m) return `https://drive.google.com/uc?export=view&id=${m[1]}`;
  }
  // Already a direct URL or unknown format – return as-is
  return url;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ── CSV fetch & parse ─────────────────────────────────────
async function loadSheet() {
  const res = await fetch(SHEET_CSV_URL);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const text = await res.text();
  const rows = text.trim().split('\n').map(r => r.split(',').map(c => c.trim().replace(/^"|"$/g, '')));
  // Detect header
  const start = rows[0][0].toLowerCase() === 'order' ? 1 : 0;
  const parsed = rows.slice(start)
    .filter(r => r.length >= 2 && r[1])
    .map(r => ({ order: parseInt(r[0]) || 0, link: driveDirectURL(r[1]) }));
  if (!parsed.length) throw new Error('No valid rows found');
  return shuffle(parsed);
}

// ── Dot indicators ───────────────────────────────────────
function buildDots(total) {
  const track = document.getElementById('dot-track');
  track.innerHTML = '';
  const show = Math.min(total, 8);
  for (let i = 0; i < show; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    track.appendChild(d);
  }
}
function setActiveDot(idx) {
  document.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.toggle('active', i === idx % Math.min(images.length, 8));
  });
}

// ── Show image ───────────────────────────────────────────
function showImage(idx) {
  const { link } = images[idx];
  const img = document.getElementById('main-img');
  const shimmer = document.getElementById('shimmer');
  const frame = document.getElementById('frame-wrap');

  img.classList.remove('visible');
  shimmer.classList.remove('hidden');
  frame.classList.remove('loaded');

  img.onload = () => {
    shimmer.classList.add('hidden');
    frame.classList.add('loaded');
    img.classList.add('visible');
  };
  img.onerror = () => {
    shimmer.classList.add('hidden');
    showError(`Could not load image.<br><small>${link}</small>`);
  };
  img.src = link;

  setActiveDot(idx);
}

function showError(msg) {
  const box = document.getElementById('error-box');
  box.innerHTML = `<h2>Couldn't load image</h2><p>${msg}</p>`;
  box.classList.add('show');
}

// ── Navigation ───────────────────────────────────────────
function nextImage() {
  if (isTransitioning || images.length === 0) return;
  isTransitioning = true;

  const veil = document.getElementById('veil');
  veil.classList.add('active');

  setTimeout(() => {
    currentIndex = (currentIndex + 1) % images.length;
    showImage(currentIndex);
    veil.classList.remove('active');
    isTransitioning = false;
  }, 340);
}

// ── Init ─────────────────────────────────────────────────
async function init() {
  if (!SHEET_CSV_URL || SHEET_CSV_URL === 'YOUR_GOOGLE_SHEET_CSV_URL_HERE') return;

  try {
    images = await loadSheet();
    buildDots(images.length);
    currentIndex = 0;
    showImage(currentIndex);
  } catch (e) {
    showError(`Could not load sheet: ${e.message}<br><small>Make sure the sheet is published as CSV.</small>`);
  }
}

// Keyboard: space / arrow / enter = next image
document.addEventListener('keydown', e => {
  if (['Space','ArrowRight','ArrowDown','Enter'].includes(e.code)) {
    e.preventDefault();
    nextImage();
  }
});

init();
</script>
</body>
</html>
